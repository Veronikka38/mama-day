<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мамины цитаты 📝</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Neucha&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="quotes-page">
    
    <!-- Летающие элементы на фоне -->
    <div class="floating-elements">
        <span class="float-item f1">💖</span>
        <span class="float-item f2">✨</span>
        <span class="float-item f3">🌸</span>
        <span class="float-item f4">💖</span>
        <span class="float-item f5">✨</span>
    </div>

    <a href="index.html" class="back-link">← Назад</a>

    <!-- Заголовок страницы -->
    <h1 class="quotes-title">Твои фразы</h1>
    <p class="quotes-subtitle">которые я помню наизусть</p>

    <div class="quotes-container">
        <!-- Стикер 1 -->
        <div class="sticky-note q1">
            <div class="tape"></div>
            <p>«Ты мне еще спасибо скажешь»</p>
        </div>
        
        <!-- Стикер 2 -->
        <div class="sticky-note q2">
            <div class="tape"></div>
            <p>«Что тебе вкусненького приготовить к приезду?»</p>
        </div>
        
        <!-- Стикер 3 -->
        <div class="sticky-note q3">
            <div class="tape"></div>
            <p>«Вставай, ты время видела?»</p>
        </div>
        
        <!-- Стикер 4 -->
        <div class="sticky-note q4">
            <div class="tape"></div>
            <p>«Ну отдохни ты уже!»</p>
        </div>

        <!-- Стикер 5 (добавим еще один для полноты) -->
        <div class="sticky-note q5">
            <div class="tape"></div>
            <p>«Как ты там, зайчик?»</p>
        </div>
        
        <!-- Стикер 6 -->
        <div class="sticky-note q6">
            <div class="tape"></div>
            <p>«Почему так редко мне звонишь?»</p>
        </div>
    </div>
</body>
</html>
